name: notifications-tests

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: notifications_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-15434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d notifications_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:${TEST_RABBITMQ_PORT:-15673}:5672"
      - "127.0.0.1:${TEST_RABBITMQ_MANAGEMENT_PORT:-15674}:15672"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 2s
      timeout: 5s
      retries: 30
